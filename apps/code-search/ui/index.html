<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="titlebar" data-tauri-drag-region>
      <div class="search">
        <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4.5 4.5"/></svg>
        <input id="q" type="text" placeholder="Describe the code you're looking for" spellcheck="false" autocomplete="off" autofocus aria-label="Search">
        <span id="spinner" class="spinner" hidden></span>
        <button id="clear-q" class="icon-btn" type="button" title="Clear" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7"/></svg>
        </button>
        <kbd class="kbd-hint">⌘K</kbd>
      </div>
      <div class="seg" id="backends" role="radiogroup" aria-label="Embed queries on">
        <button type="button" role="radio" data-backend="rawgpu" title="Embed queries on the RX 590 (⌘1)"><span class="bdot"></span>RX 590</button>
        <button type="button" role="radio" data-backend="mps" title="Embed queries on the Mac's GPU with PyTorch (⌘2)"><span class="bdot"></span>Mac GPU</button>
        <button type="button" role="radio" data-backend="cpu" title="Embed queries on the Mac's CPU with PyTorch (⌘3)"><span class="bdot"></span>Mac CPU</button>
      </div>
    </header>

    <div class="filterbar" data-tauri-drag-region>
      <button class="chip" id="f-project" type="button"><span class="chip-k">Project</span><span class="chip-v">Any</span></button>
      <button class="chip" id="f-lang" type="button"><span class="chip-k">Language</span><span class="chip-v">Any</span></button>
      <button class="chip" id="f-path" type="button"><span class="chip-k">Path</span><span class="chip-v">Any</span></button>
      <button class="link-btn" id="f-clear" type="button" hidden>Clear filters</button>
      <span class="spacer" data-tauri-drag-region></span>
      <label class="toggle" title="One result per file, with its best matches"><input type="checkbox" id="group" checked><span>Group by file</span></label>
      <label class="toggle" title="Fold identical chunks from copies of a project"><input type="checkbox" id="dedupe" checked><span>Fold copies</span></label>
      <label class="mini">Show
        <select id="k"><option value="10">10</option><option value="20" selected>20</option><option value="50">50</option></select>
      </label>
    </div>

    <div id="banner" class="banner" role="alert" hidden>
      <svg class="banner-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5 18 17H2z"/><path d="M10 8v4m0 2.6v.1"/></svg>
      <span id="banner-text"></span>
      <span class="banner-actions" id="banner-actions"></span>
    </div>

    <main class="split">
      <aside class="list" aria-label="Results">
        <ol id="results" class="results"></ol>
      </aside>
      <section class="preview" id="preview" aria-label="Preview"></section>
    </main>

    <footer class="statusbar">
      <span class="sb-backend" id="sb-backend"></span>
      <span class="sb-timing" id="sb-timing"></span>
      <span class="sb-keys"><kbd>↑↓</kbd> results <kbd>⌥↑↓</kbd> matches <kbd>⌘↩</kbd> open <kbd>⌘1–3</kbd> backend</span>
    </footer>
  </div>

  <div id="popover" class="popover" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="vendor/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
