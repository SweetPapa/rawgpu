[workspace]
members = ["rawgpu-tray", "code-search"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
tauri = { version = "2.9", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-build = { version = "2.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
strip = true
lto = "thin"
