<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rawgpu: RX 590</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="details.css">
</head>
<body>
  <header class="bar" data-tauri-drag-region>
    <div class="bar-title" data-tauri-drag-region>
      <span class="pill" id="pill"><span class="dot"></span><span id="pill-text">…</span></span>
      <span id="headline" class="headline"></span>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="activity" aria-selected="true">Activity</button>
      <button type="button" role="tab" data-tab="card">Card</button>
      <button type="button" role="tab" data-tab="server">Server</button>
    </div>
  </header>

  <main>
    <section data-panel="activity">
      <div class="toolbar">
        <span class="muted" id="log-count"></span>
        <span class="tb-btns">
          <button class="btn" id="copy-log" type="button">Copy</button>
          <button class="btn" id="logs" type="button" title="~/rawgpu-index/logs">Index Logs</button>
        </span>
      </div>
      <div class="log" id="log"></div>
    </section>

    <section data-panel="card" hidden>
      <div class="toolbar">
        <span class="muted" id="card-age"></span>
        <span class="tb-btns"><button class="btn" id="refresh" type="button">Refresh</button></span>
      </div>
      <dl class="grid" id="card"></dl>
      <div class="toolbar">
        <span class="label">Full status</span>
        <span class="tb-btns"><button class="btn" id="full" type="button">Read</button></span>
      </div>
      <pre class="pre" id="full-out" hidden></pre>
    </section>

    <section data-panel="server" hidden>
      <dl class="grid" id="server"></dl>
      <div class="note">rawgpu talks to the card through the TinyGPU server, which serves one program at a time. This app looks
        at processes to see who has the card, so it never waits behind a long job and never starts the server by itself.</div>
    </section>
  </main>
  <script src="details.js"></script>
</body>
</html>
