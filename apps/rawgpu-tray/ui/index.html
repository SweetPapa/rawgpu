<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rawgpu: RX 590</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="head">
      <span id="dot" class="dot"></span>
      <div>
        <h1 id="headline">RX 590</h1>
        <p id="detail" class="muted"></p>
        <p id="user" class="muted"></p>
      </div>
    </div>
    <div class="actions">
      <button id="eject" class="primary">Eject</button>
      <button id="up">Connect and Bring Up</button>
      <button id="refresh" title="Read the card again">Refresh</button>
      <button id="search">Code Search</button>
      <button id="logs" title="~/rawgpu-index/logs">Index Logs</button>
    </div>
  </header>

  <main>
    <section>
      <h2>Card <span id="status-age" class="muted small"></span></h2>
      <dl id="card" class="grid"></dl>
    </section>

    <section id="indexer-section" hidden>
      <h2>Indexer</h2>
      <dl id="indexer" class="grid"></dl>
    </section>

    <section>
      <h2>TinyGPU server</h2>
      <dl id="server" class="grid"></dl>
    </section>

    <section>
      <h2>Activity</h2>
      <pre id="log" class="log">Nothing yet.</pre>
    </section>

    <section>
      <h2>Full status <button id="full" class="small-btn">Read</button></h2>
      <pre id="full-out" class="log" hidden></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
