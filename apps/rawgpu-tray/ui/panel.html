<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rawgpu</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="root" class="pn">
    <header class="pn-head">
      <svg class="chip-art" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="7" y="7" width="18" height="18" rx="3.5"/>
        <path d="M11 7V4m5 3V4m5 3V4M11 28v-3m5 3v-3m5 3v-3M7 11H4m3 5H4m3 5H4m24-10h-3m3 5h-3m3 5h-3"/>
        <rect x="11.5" y="11.5" width="9" height="9" rx="1.5" class="core"/>
      </svg>
      <div class="pn-title">
        <div class="pn-name">RX 590</div>
        <div class="pn-sub" id="sub">Polaris 10</div>
      </div>
      <span class="pill" id="pill"><span class="dot"></span><span id="pill-text">…</span></span>
    </header>

    <div id="alert" class="alert" hidden>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 14.5 13.5h-13z"/><path d="M8 6.5v3.2m0 2v.1"/></svg>
      <div><div id="alert-title" class="alert-title"></div><div id="alert-text" class="alert-text"></div></div>
    </div>

    <section id="setup" class="setup" hidden>
      <div class="label">Set up</div>
      <ol class="checks" id="checks"></ol>
    </section>

    <section id="main-view">
      <div class="tiles" id="tiles"></div>

      <div class="chart" id="chart">
        <div class="chart-head">
          <span class="chart-title">Temperature</span>
          <span class="chart-range" id="chart-range"></span>
        </div>
        <div class="chart-box" id="chart-box">
          <svg id="spark" class="spark" preserveAspectRatio="none" aria-label="Temperature history"></svg>
          <div class="chart-tip" id="chart-tip" hidden></div>
          <div class="chart-empty" id="chart-empty">The history fills in as readings come in.</div>
        </div>
      </div>

      <div class="holder" id="holder" hidden>
        <div class="label">In use by</div>
        <div class="holder-row">
          <span class="holder-icon" id="holder-icon"></span>
          <div class="holder-main">
            <div class="holder-name"><span id="holder-name"></span><span class="holder-time" id="holder-time"></span></div>
            <div class="holder-cmd mono" id="holder-cmd"></div>
            <div class="holder-stats" id="holder-stats"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="flow" class="flow" hidden>
      <div class="flow-head"><span class="label" id="flow-title">Ejecting</span><span class="flow-time" id="flow-time"></span></div>
      <ol class="steps" id="steps"></ol>
    </section>

    <section id="result" class="result" hidden>
      <div class="result-icon" id="result-icon"></div>
      <div class="result-title" id="result-title"></div>
      <div class="result-text" id="result-text"></div>
    </section>

    <section class="actions" id="actions">
      <button class="btn primary big" id="primary" type="button"></button>
      <div class="secondary" id="secondary"></div>
    </section>

    <section id="settings" class="settings" hidden>
      <div class="label">Settings</div>
      <label class="set"><span>Open at login<small id="login-note"></small></span><span class="switch"><input type="checkbox" id="s-login"><span></span></span></label>
      <label class="set"><span>Show the temperature in the menu bar</span><span class="switch"><input type="checkbox" id="s-temp"><span></span></span></label>
      <label class="set"><span>Alert me at
        <select id="s-alert-c"><option>70</option><option>75</option><option selected>80</option><option>85</option></select> °C</span>
        <span class="switch"><input type="checkbox" id="s-alerts"><span></span></span></label>
      <label class="set"><span>Tell me when indexing finishes</span><span class="switch"><input type="checkbox" id="s-indexer"><span></span></span></label>
      <div class="set-foot">
        <span class="mono faint" id="cli-path"></span>
        <button class="btn" id="quit" type="button">Quit rawgpu</button>
      </div>
    </section>

    <footer class="pn-foot">
      <span id="updated"></span>
      <span class="foot-btns">
        <button class="icon-btn" id="b-settings" type="button" title="Settings (⌘,)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6m0 9.2v1.6M1.8 8h1.6m9.2 0h1.6M3.6 3.6l1.1 1.1m6.6 6.6 1.1 1.1m0-8.8-1.1 1.1m-6.6 6.6-1.1 1.1"/></svg>
        </button>
      </span>
    </footer>
  </div>
  <script src="panel.js"></script>
</body>
</html>
